# Builds the CG++ desktop app for Linux, Windows and macOS (Apple Silicon and Intel).
# Runs on every pushed tag like v1.0 (and attaches the apps to that GitHub release),
# or by hand from the Actions tab ("Run workflow"), where the apps appear as downloadable artifacts.
name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # older Ubuntu = the app runs on more Linux systems
            asset: cgplusplus-linux-x86_64.tar.gz
          - os: windows-2022
            asset: cgplusplus-windows-x86_64.exe
          - os: macos-15         # Apple Silicon; the app needs macOS 14 or newer
            asset: cgplusplus-macos-arm64.zip
          - os: macos-15-intel   # Intel; the app needs macOS 12 or newer
            asset: cgplusplus-macos-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt

      # SciPy has two Intel Mac builds and pip would pick the one that needs macOS 14, so install the one
      # that runs on older systems first. Together with PySide6 6.8 the Intel app runs on macOS 12+.
      - name: SciPy for older macOS (Intel Mac)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          pip download --no-deps --only-binary=:all: --platform macosx_12_0_x86_64 --python-version 3.10 \
              --implementation cp "$(grep -i '^scipy==' requirements-build.txt)" -d older-wheels
          pip install older-wheels/scipy-*.whl

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      # libxcb-cursor0 gets bundled into the app (some desktops lack it). libegl1 and libgl1 belong to the
      # graphics driver, so they are never bundled: every Linux desktop has them, but this server
      # does not, and the self-test below needs them to load Qt the way a real desktop would.
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libgl1

      - name: Build
        run: pyinstaller --noconfirm --clean cgplusplus.spec

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: ${{ github.workspace }}/dist/cgplusplus --selftest

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $p = Start-Process -FilePath "${{ github.workspace }}\dist\cgplusplus.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          "${{ github.workspace }}/dist/CG++.app/Contents/MacOS/cgplusplus" --selftest

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist cgplusplus -C .. LICENSE README.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist\cgplusplus.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/CG++.app" ${{ matrix.asset }}   # keeps the app's signature intact

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
